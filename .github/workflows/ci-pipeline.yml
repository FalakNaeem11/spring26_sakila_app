name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.9"
  IMAGE_NAME: sakila-app

jobs:
  lint:
    name: Lint (Code Quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=.git,__pycache__,*.egg-info \
            --count \
            --statistics

  test:
    name: Test (Unit Tests with MySQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: sakila
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DB: sakila
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for MySQL to be healthy
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -padmin --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... attempt $i"
            sleep 2
          done

      - name: Download and import Sakila database
        run: |
          curl -sLo sakila-db.tar.gz https://downloads.mysql.com/docs/sakila-db.tar.gz
          tar -xzf sakila-db.tar.gz
          mysql -h 127.0.0.1 -uroot -padmin < sakila-db/sakila-schema.sql
          mysql -h 127.0.0.1 -uroot -padmin < sakila-db/sakila-data.sql
          echo "Sakila database loaded successfully"
          mysql -h 127.0.0.1 -uroot -padmin -e "USE sakila; SELECT COUNT(*) AS film_count FROM film;"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  build:
    name: Build (Docker Image)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Verify image was created
        run: docker images ${{ env.IMAGE_NAME }}

      - name: Smoke test — start container and check port 5000
        run: |
          docker run -d \
            --name smoke-test \
            -p 5000:5000 \
            -e MYSQL_HOST=localhost \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=admin \
            -e MYSQL_DB=sakila \
            -e SECRET_KEY=smoke-test-key \
            ${{ env.IMAGE_NAME }}:latest

          echo "Waiting for Flask to start..."
          sleep 8

          # Check the container is still running
          docker ps --filter name=smoke-test

          # Attempt HTTP check (app may 500 without DB, but port should respond)
          curl -o /dev/null -s -w "HTTP status: %{http_code}\n" http://localhost:5000/ || true

          docker stop smoke-test
          docker rm smoke-test

      - name: Save image as artifact
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > sakila-app-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: sakila-app-image.tar.gz
          retention-days: 1

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:scan"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"
          output: trivy-report.txt

      - name: Show scan summary
        run: |
          echo "=== Trivy Security Scan Report ==="
          cat trivy-report.txt || echo "Report not generated"

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report-${{ github.sha }}
          path: trivy-report.txt
          retention-days: 30
